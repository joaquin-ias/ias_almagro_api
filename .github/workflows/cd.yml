name: CD Pipeline

on:
  push:
    branches: [develop, main]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to DEV
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

  deploy-qa:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to QA
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK_QA }}"

  deploy-prd:
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to PRD
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK_PRD }}"
